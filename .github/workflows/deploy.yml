# Тесты и сборка на каждый push. Одиночная игра выкладывается на GitHub Pages, только когда репозиторий публичный
# (на бесплатном тарифе Pages из приватного репозитория не работает); нужен Settings → Pages → Source: GitHub Actions.
name: CI and GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # версия pnpm берётся из packageManager в package.json (указать её и здесь — действие остановится с ошибкой)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with: { path: dist }
  # сервер сетевой игры на Render: сервис создан из публичной ссылки на репозиторий, сам за коммитами не следит —
  # выкладку запускает его Deploy Hook (адрес — в секрете RENDER_DEPLOY_HOOK_URL; без секрета шаг ничего не делает)
  render:
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL is not set: the Render service is updated by hand"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Render deploy triggered"
  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
