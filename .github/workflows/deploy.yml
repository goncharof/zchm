# Тесты и сборка на каждый push. Одиночная игра выкладывается на GitHub Pages, только когда репозиторий публичный
# (на бесплатном тарифе Pages из приватного репозитория не работает); нужен Settings → Pages → Source: GitHub Actions.
name: CI and GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # версия pnpm берётся из packageManager в package.json (указать её и здесь — действие остановится с ошибкой)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with: { path: dist }
  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
